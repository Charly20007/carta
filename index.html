<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Fátima ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="content-wrapper">
        <h1 class="title" id="title">Tengo algo especial para ti...</h1>
        
        <div class="scene" id="scene">
            <!-- Atrás del sobre -->
            <div class="envelope-back" id="envBack"></div>
            
            <!-- La carta mágica -->
            <div class="letter" id="letter">
                <div id="letterContent" class="text-content"></div>
                
                <div class="photo-container" id="photoContainer">
                    <img src="57573EFD-ABA5-4011-B841-178F8EF4B607_1_105_c.jpeg" alt="Fátima y Yo">
                    <p class="photo-caption">Nuestra foto ❤️</p>
                </div>
            </div>
            
            <!-- Frente del sobre -->
            <div class="envelope-front" id="envFront">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="heart-seal" id="heartSeal">💖</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
